name: Check Pending Review Requests (all repos)

on:
  schedule:
    # Brisbane time (UTC+10, no DST): runs weekday 7am–6pm Brisbane.
    # 7am–7pm local spans midnight UTC, so it's split across two crons:
    # - 21-23 UTC Sun–Thu  = Brisbane Mon–Fri 7–9am (next UTC day)
    # - 0-8 UTC Mon–Fri    = Brisbane Mon–Fri 10am–6pm
    # Stable year-round because Brisbane doesn't observe daylight saving.
    - cron: "0 21-23 * * 0-4"
    - cron: "0 0-8 * * 1-5"
  workflow_dispatch: # allow manual runs

# needed to commit the dedupe state back to the repo
permissions:
  contents: write

concurrency:
  group: review-poll
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll review requests and notify Slack
        env:
          GH_TOKEN: ${{ secrets.POLL_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bash .github/scripts/poll-review-requests.sh

      - name: Commit updated dedupe state
        run: |
          git add .github/review-notified.txt
          if git diff --cached --quiet -- .github/review-notified.txt; then
            echo "State unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update review poll state [skip ci]"
          git push
