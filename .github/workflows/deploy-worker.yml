# Deploys the review-notifier Cloudflare Worker on every push to main
# that touches this directory or this workflow.
#
# Requires repo secret CLOUDFLARE_API_TOKEN:
# Cloudflare dashboard, My Profile, API Tokens, Create Token,
# use the Edit Cloudflare Workers template, then paste the value.

name: Deploy review-notifier worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: # manual re-deploy

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare-worker
